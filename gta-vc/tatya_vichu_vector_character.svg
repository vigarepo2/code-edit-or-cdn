<g fill="#d30a1c">
<path d="M333 196 L283 147 L363 166Z"/><path d="M383 143 L365 77 L424 130Z"/>
<path d="M441 118 L462 51 L486 125Z"/><path d="M508 111 L554 47 L551 132Z"/>
<path d="M578 127 L639 77 L616 151Z"/><path d="M635 151 L706 121 L666 187Z"/>
<path d="M677 190 L746 182 L695 226Z"/>
</g>

<!-- brows -->
<path d="M365 277 Q416 245 462 271" fill="none" stroke="#7d0a19" stroke-width="18" stroke-linecap="round"/>
<path d="M547 267 Q598 239 643 265" fill="none" stroke="#7d0a19" stroke-width="18" stroke-linecap="round"/>

