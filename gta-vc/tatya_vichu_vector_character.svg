<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Red-haired character profile icon</title>
<desc id="desc">Original vector avatar with red spiky hair, unimpressed expression, black streetwear, backpack and sneakers.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#35070b"/><stop offset=".55" stop-color="#8d1018"/><stop offset="1" stop-color="#250407"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#dc2630" stop-opacity=".72"/><stop offset=".68" stop-color="#a5111b" stop-opacity=".18"/><stop offset="1" stop-color="#210306" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="face" x1=".18" y1=".05" x2=".8" y2=".9">
    <stop stop-color="#fff8f1"/><stop offset=".7" stop-color="#e9d5cb"/><stop offset="1" stop-color="#c7a79c"/>
  </linearGradient>
  <linearGradient id="hair" x1=".2" y1="0" x2=".75" y2="1">
    <stop stop-color="#ff2934"/><stop offset=".48" stop-color="#ba0716"/><stop offset="1" stop-color="#62040d"/>
  </linearGradient>
  <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#27272b"/><stop offset=".5" stop-color="#111114"/><stop offset="1" stop-color="#050506"/>
  </linearGradient>
  <linearGradient id="pants" x1=".2" y1="0" x2=".8" y2="1">
    <stop stop-color="#242429"/><stop offset="1" stop-color="#09090b"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>

<!-- background -->
<rect width="1024" height="1024" rx="180" fill="url(#bg)"/>
<circle cx="520" cy="380" r="390" fill="url(#halo)"/>
<ellipse cx="515" cy="916" rx="270" ry="34" fill="#120204" opacity=".65" filter="url(#shadow)"/>

<!-- backpack -->
<path d="M321 420 Q264 458 274 612 L309 702 Q332 721 366 701 L385 469 Q370 425 321 420Z" fill="#09090c" stroke="#35343a" stroke-width="9"/>
<path d="M333 449 Q371 395 421 424" fill="none" stroke="#35343a" stroke-width="17" stroke-linecap="round"/>

<!-- legs -->
<path d="M426 681 Q402 769 405 894 L360 949 Q374 978 429 969 L482 917 L499 731Z" fill="url(#pants)"/>
<path d="M500 708 L548 712 Q581 788 594 902 L650 952 Q640 981 582 970 L526 921 Q493 815 500 708Z" fill="url(#pants)"/>

<!-- cargo pockets -->
<path d="M397 760 L457 748 L464 824 L399 831Z" fill="#17171b" stroke="#35353a" stroke-width="6"/>
<path d="M538 756 L588 765 L598 831 L548 825Z" fill="#17171b" stroke="#35353a" stroke-width="6"/>
<path d="M404 771 L455 762" stroke="#515158" stroke-width="5"/>
<path d="M545 772 L589 780" stroke="#515158" stroke-width="5"/>

<!-- shoes -->
<path d="M356 903 Q392 895 427 916 L459 953 Q466 978 437 990 L338 988 Q315 978 326 953Z" fill="#eee8df" stroke="#bdb6ad" stroke-width="7"/>
<path d="M554 911 Q588 899 616 918 L679 957 Q694 979 666 990 L555 988 Q533 979 538 955Z" fill="#eee8df" stroke="#bdb6ad" stroke-width="7"/>
<path d="M345 951 Q389 939 437 960" fill="none" stroke="#a69f97" stroke-width="6"/>
<path d="M556 954 Q607 944 659 969" fill="none" stroke="#a69f97" stroke-width="6"/>
<path d="M374 944 q25-17 48 0" fill="none" stroke="#555158" stroke-width="7"/>
<path d="M573 947 q26-17 49 0" fill="none" stroke="#555158" stroke-width="7"/>

<!-- torso hoodie -->
<path d="M363 431 Q410 385 503 390 Q598 394 652 459 L630 681 Q559 718 425 691 L354 623Z" fill="#0b0b0e"/>
<path d="M412 416 Q476 370 549 411 Q511 458 469 463 Q434 458 412 416Z" fill="#16161a"/>
<path d="M464 442 L458 545 M529 441 L536 545" stroke="#77747b" stroke-width="7" stroke-linecap="round"/>

<!-- jacket -->
<path d="M373 430 Q330 462 323 538 L340 682 Q382 700 431 681 L448 492Z" fill="url(#jacket)" stroke="#333238" stroke-width="6"/>
<path d="M552 435 Q626 440 662 502 L651 661 Q618 689 576 677 L544 489Z" fill="url(#jacket)" stroke="#333238" stroke-width="6"/>
<path d="M441 450 L471 493 L451 659" fill="none" stroke="#606067" stroke-width="7"/>
<path d="M552 452 L522 493 L548 661" fill="none" stroke="#606067" stroke-width="7"/>

<!-- hands in pockets -->
<path d="M358 618 Q378 603 398 622 Q402 648 378 665 Q349 658 358 618Z" fill="url(#face)"/>
<path d="M602 615 Q625 603 641 625 Q641 653 615 664 Q591 651 602 615Z" fill="url(#face)"/>

<!-- neck -->
