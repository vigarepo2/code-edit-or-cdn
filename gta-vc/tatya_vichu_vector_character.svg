<path d="M506 292 Q484 341 499 360 Q516 374 538 353" fill="#c89f94" stroke="#9d756e" stroke-width="5"/>

<!-- expression -->
<path d="M461 393 Q504 380 552 393" fill="none" stroke="#86101a" stroke-width="10" stroke-linecap="round"/>
<path d="M475 394 Q509 401 540 394" fill="none" stroke="#b52630" stroke-width="4" opacity=".65"/>

<!-- subtle cheek shading -->
<ellipse cx="379" cy="369" rx="53" ry="25" fill="#a34b55" opacity=".08" filter="url(#soft)"/>
<ellipse cx="629" cy="362" rx="49" ry="24" fill="#a34b55" opacity=".08" filter="url(#soft)"/>

<!-- jacket details -->
<path d="M368 510 L417 525" stroke="#4a494f" stroke-width="6" stroke-linecap="round"/>
<path d="M591 523 L635 505" stroke="#4a494f" stroke-width="6" stroke-linecap="round"/>
<circle cx="453" cy="493" r="5" fill="#a9a7ad"/><circle cx="547" cy="493" r="5" fill="#a9a7ad"/>
</svg>