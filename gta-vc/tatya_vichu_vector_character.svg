<!-- ears -->
<ellipse cx="314" cy="317" rx="32" ry="48" fill="#d8b9af"/>
<ellipse cx="704" cy="306" rx="29" ry="45" fill="#d8b9af"/>

<!-- hair mass -->
<path d="M306 263
Q276 218 326 194 Q286 151 352 151 Q326 102 397 120
Q390 70 449 104 Q469 55 504 101 Q538 49 559 104
Q605 64 610 119 Q674 89 660 148 Q723 135 690 189
Q743 197 704 238 Q659 207 619 194 Q556 167 481 177
Q395 186 333 277Z" fill="url(#hair)"/>
