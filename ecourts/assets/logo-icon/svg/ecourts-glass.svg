<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 1024 1024"
     fill="none">

  <defs>
    <!-- =========================
         BACKGROUND
    ========================== -->
    <linearGradient id="bg" x1="118" y1="72" x2="906" y2="956" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.38" stop-color="#0B2038"/>
      <stop offset="0.72" stop-color="#0C2E46"/>
      <stop offset="1" stop-color="#06111F"/>
    </linearGradient>

    <radialGradient id="bgGlow" cx="0" cy="0" r="1"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(512 282) rotate(90) scale(580)">
      <stop stop-color="#3FE4FF" stop-opacity="0.17"/>
      <stop offset="0.45" stop-color="#218ED6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>

    <!-- =========================
         GLASS SURFACE
    ========================== -->
    <linearGradient id="glass"
                    x1="252" y1="190"
                    x2="775" y2="850"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.30" stop-color="#E8F9FF" stop-opacity="0.09"/>
      <stop offset="0.65" stop-color="#6BD9FF" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/>
    </linearGradient>

    <linearGradient id="glassEdge"
                    x1="217" y1="156"
                    x2="807" y2="879"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="0.23" stop-color="#7FE6FF" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#419CC5" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.21"/>
    </linearGradient>

    <!-- =========================
         METAL / COURT SYMBOL
    ========================== -->
    <linearGradient id="silver"
                    x1="337" y1="276"
                    x2="693" y2="769"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.15" stop-color="#DFF7FF"/>
      <stop offset="0.34" stop-color="#A7D9EA"/>
      <stop offset="0.58" stop-color="#F7FDFF"/>
      <stop offset="0.76" stop-color="#8DBFD3"/>
      <stop offset="1" stop-color="#DDF5FF"/>
    </linearGradient>

    <linearGradient id="silverSoft"
                    x1="512" y1="322"
                    x2="512" y2="755"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.97"/>
      <stop offset="0.5" stop-color="#C8E8F4" stop-opacity="0.93"/>
      <stop offset="1" stop-color="#86B9CE" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="blueAccent"
                    x1="356" y1="296"
                    x2="668" y2="750"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#76EEFF"/>
      <stop offset="0.45" stop-color="#36C5F0"/>
      <stop offset="1" stop-color="#1283C8"/>
    </linearGradient>

    <linearGradient id="cyanStroke"
                    x1="315" y1="257"
                    x2="697" y2="779"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9FAFF"/>
      <stop offset="0.30" stop-color="#65E8FF"/>
      <stop offset="0.72" stop-color="#24A2D7"/>
      <stop offset="1" stop-color="#D6F8FF"/>
    </linearGradient>

    <linearGradient id="baseGradient"
                    x1="314" y1="713"
                    x2="708" y2="811"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9E6F6"/>
      <stop offset="0.48" stop-color="#F7FDFF"/>
      <stop offset="1" stop-color="#7DBBD1"/>
    </linearGradient>

    <!-- =========================
         SHADOWS / GLOWS
    ========================== -->
    <filter id="outerShadow"
            x="-20%" y="-20%"
            width="140%" height="140%">
      <feDropShadow dx="0" dy="34" stdDeviation="38"
                    flood-color="#000914"
                    flood-opacity="0.58"/>
    </filter>

    <filter id="symbolShadow"
            x="-30%" y="-30%"
            width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18"
                    flood-color="#00101C"
                    flood-opacity="0.48"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8"
                    flood-color="#53DFFF"
                    flood-opacity="0.14"/>
    </filter>

    <filter id="softGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>

    <filter id="smallGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="cardClip">
      <rect x="144" y="144" width="736" height="736" rx="188"/>
    </clipPath>
  </defs>


  <!-- ==========================================================
       APP ICON FOUNDATION
  =========================================================== -->

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#bgGlow)"/>

  <!-- subtle corner bloom -->
  <circle cx="222" cy="204" r="260"
          fill="#39D8FF"
          fill-opacity="0.035"
          filter="url(#softGlow)"/>

  <circle cx="814" cy="812" r="260"
          fill="#0D7BBC"
          fill-opacity="0.055"
          filter="url(#softGlow)"/>

  <!-- outer precision rim -->
  <rect x="25" y="25"
        width="974" height="974"
        rx="211"
        stroke="#FFFFFF"
        stroke-opacity="0.055"
        stroke-width="2"/>

  <rect x="42" y="42"
        width="940" height="940"
        rx="200"
        stroke="#74DFFF"
        stroke-opacity="0.055"
        stroke-width="1.5"/>


  <!-- ==========================================================
       CENTRAL GLASS PANEL
  =========================================================== -->

  <g filter="url(#outerShadow)">
    <rect x="144"
          y="144"
          width="736"
          height="736"
          rx="188"
          fill="url(#glass)"/>

    <rect x="145.5"
          y="145.5"
          width="733"
          height="733"
          rx="186.5"
          stroke="url(#glassEdge)"
          stroke-width="3"/>
  </g>

  <!-- glass internal highlight -->
  <g clip-path="url(#cardClip)">
    <path d="M139 222
             C275 138 447 119 628 165
             C718 188 802 234 878 310
             L878 146
             L142 146
             Z"
          fill="#FFFFFF"
          fill-opacity="0.038"/>

    <path d="M197 181
             C305 150 422 153 522 179"
          stroke="#FFFFFF"
          stroke-opacity="0.24"
          stroke-width="4"
          stroke-linecap="round"/>

    <path d="M827 232
             C849 290 858 340 858 392"
          stroke="#A7EDFF"
          stroke-opacity="0.16"
          stroke-width="3"
          stroke-linecap="round"/>

    <!-- tiny glass particles -->
    <circle cx="237" cy="316" r="3" fill="#FFFFFF" fill-opacity="0.24"/>
    <circle cx="790" cy="330" r="2.2" fill="#7AE8FF" fill-opacity="0.32"/>
    <circle cx="751" cy="690" r="2.5" fill="#FFFFFF" fill-opacity="0.18"/>
    <circle cx="274" cy="721" r="2" fill="#69DFFF" fill-opacity="0.22"/>
  </g>


  <!-- ==========================================================
       SYMBOL AURA
  =========================================================== -->

  <ellipse cx="512"
           cy="717"
           rx="245"
           ry="58"
           fill="#30C9F5"
           fill-opacity="0.09"
           filter="url(#softGlow)"/>

  <circle cx="512"
          cy="473"
          r="244"
          stroke="#55DDFF"
          stroke-opacity="0.055"
          stroke-width="2"/>

  <circle cx="512"
          cy="473"
          r="212"
          stroke="#FFFFFF"
          stroke-opacity="0.033"
          stroke-width="1"/>


  <!-- ==========================================================
       MODERN COURTHOUSE
  =========================================================== -->

  <g filter="url(#symbolShadow)">

    <!-- Roof halo -->
    <path d="M316 390
             L500 282
             C507 278 517 278 524 282
             L708 390"
          stroke="#56DFFF"
          stroke-opacity="0.17"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#smallGlow)"/>

    <!-- Main triangular pediment -->
    <path d="M305 404
             L495 288
             C505 282 519 282 529 288
             L719 404
             C725 408 722 418 714 418
             H310
             C302 418 299 408 305 404Z"
          fill="url(#silver)"
          stroke="url(#cyanStroke)"
          stroke-width="3"/>

    <!-- Pediment inner face -->
    <path d="M358 396
             L505 307
             C509 304 515 304 519 307
             L666 396
             H358Z"
          fill="#09293D"
          fill-opacity="0.58"
          stroke="#B8F3FF"
          stroke-opacity="0.28"
          stroke-width="2"/>

    <!-- Modern justice mark inside pediment -->
    <circle cx="512"
            cy="357"
            r="35"
            fill="#09283B"
            stroke="#BFF6FF"
            stroke-opacity="0.38"
            stroke-width="2"/>

    <path d="M512 335V378"
          stroke="url(#blueAccent)"
          stroke-width="8"
          stroke-linecap="round"/>

    <path d="M487 348H537"
          stroke="url(#silverSoft)"
          stroke-width="7"
          stroke-linecap="round"/>

    <circle cx="512"
            cy="333"
            r="6.5"
            fill="#DDFBFF"/>


    <!-- entablature -->
    <rect x="331"
          y="421"
          width="362"
          height="24"
          rx="10"
          fill="url(#silver)"/>

    <rect x="346"
          y="449"
          width="332"
          height="18"
          rx="8"
          fill="#B4E2EF"
          fill-opacity="0.93"/>

    <path d="M360 456H664"
          stroke="#FFFFFF"
          stroke-opacity="0.52"
          stroke-width="2"/>


    <!-- ======================================================
         COLUMNS
    ======================================================= -->

    <!-- left column -->
    <g>
      <rect x="365"
            y="478"
            width="58"
            height="211"
            rx="22"
            fill="url(#silverSoft)"/>

      <path d="M378 495V670"
            stroke="#FFFFFF"
            stroke-opacity="0.46"
            stroke-width="4"
            stroke-linecap="round"/>

      <path d="M410 495V670"
            stroke="#4E98B4"
            stroke-opacity="0.22"
            stroke-width="3"
            stroke-linecap="round"/>

      <rect x="353"
            y="466"
            width="82"
            height="25"
            rx="10"
            fill="url(#silver)"/>

      <rect x="354"
            y="678"
            width="80"
            height="22"
            rx="9"
            fill="url(#silver)"/>
    </g>


    <!-- inner-left column -->
    <g>
      <rect x="445"
            y="478"
            width="47"
            height="211"
            rx="18"
            fill="url(#silverSoft)"/>

      <path d="M457 496V671"
            stroke="#FFFFFF"
            stroke-opacity="0.42"
            stroke-width="3.5"
            stroke-linecap="round"/>

      <rect x="436"
            y="467"
            width="65"
            height="24"
            rx="9"
            fill="url(#silver)"/>

      <rect x="437"
            y="678"
            width="63"
            height="22"
            rx="8"
            fill="url(#silver)"/>
    </g>


    <!-- inner-right column -->
    <g>
      <rect x="532"
            y="478"
            width="47"
            height="211"
            rx="18"
            fill="url(#silverSoft)"/>

      <path d="M544 496V671"
            stroke="#FFFFFF"
            stroke-opacity="0.42"
            stroke-width="3.5"
            stroke-linecap="round"/>

      <rect x="523"
            y="467"
            width="65"
            height="24"
            rx="9"
            fill="url(#silver)"/>

      <rect x="524"
            y="678"
            width="63"
            height="22"
            rx="8"
            fill="url(#silver)"/>
    </g>


    <!-- right column -->
    <g>
      <rect x="601"
            y="478"
            width="58"
            height="211"
            rx="22"
            fill="url(#silverSoft)"/>

      <path d="M614 495V670"
            stroke="#FFFFFF"
            stroke-opacity="0.46"
            stroke-width="4"
            stroke-linecap="round"/>

      <path d="M646 495V670"
            stroke="#4E98B4"
            stroke-opacity="0.22"
            stroke-width="3"
            stroke-linecap="round"/>

      <rect x="589"
            y="466"
            width="82"
            height="25"
            rx="10"
            fill="url(#silver)"/>

      <rect x="590"
            y="678"
            width="80"
            height="22"
            rx="9"
            fill="url(#silver)"/>
    </g>


    <!-- ======================================================
         CENTRAL GLASS DOOR / DIGITAL JUSTICE CORE
    ======================================================= -->

    <rect x="493"
          y="496"
          width="38"
          height="183"
          rx="16"
          fill="#08243A"
          fill-opacity="0.82"
          stroke="#76E8FF"
          stroke-opacity="0.34"
          stroke-width="2"/>

    <path d="M512 513V662"
          stroke="#42D7FF"
          stroke-opacity="0.42"
          stroke-width="3"
          stroke-linecap="round"/>


    <!-- ======================================================
         BASE
    ======================================================= -->

    <rect x="320"
          y="704"
          width="384"
          height="24"
          rx="11"
          fill="url(#baseGradient)"/>

    <rect x="298"
          y="734"
          width="428"
          height="29"
          rx="13"
          fill="url(#silver)"/>

    <rect x="273"
          y="769"
          width="478"
          height="35"
          rx="17.5"
          fill="url(#baseGradient)"/>

    <path d="M302 746H722"
          stroke="#FFFFFF"
          stroke-opacity="0.43"
          stroke-width="2"/>

    <path d="M302 786H722"
          stroke="#FFFFFF"
          stroke-opacity="0.48"
          stroke-width="2"/>

  </g>


  <!-- ==========================================================
       DIGITAL / GLASS DETAIL ACCENTS
  =========================================================== -->

  <!-- left circuit -->
  <path d="M255 532H298
           C311 532 317 526 317 513
           V489"
        stroke="#4DDBFF"
        stroke-opacity="0.31"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <circle cx="252"
          cy="532"
          r="5"
          fill="#9AF0FF"
          fill-opacity="0.73"/>

  <circle cx="317"
          cy="486"
          r="4"
          fill="#38CFFF"
          fill-opacity="0.7"/>


  <!-- right circuit -->
  <path d="M769 570H728
           C715 570 708 577 708 590
           V610"
        stroke="#4DDBFF"
        stroke-opacity="0.29"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <circle cx="772"
          cy="570"
          r="5"
          fill="#9AF0FF"
          fill-opacity="0.7"/>

  <circle cx="708"
          cy="614"
          r="4"
          fill="#38CFFF"
          fill-opacity="0.67"/>


  <!-- ==========================================================
       MICRO HIGHLIGHTS
  =========================================================== -->

  <path d="M339 405
           L500 307"
        stroke="#FFFFFF"
        stroke-opacity="0.42"
        stroke-width="3"
        stroke-linecap="round"/>

  <path d="M304 786
           H541"
        stroke="#FFFFFF"
        stroke-opacity="0.28"
        stroke-width="3"
        stroke-linecap="round"/>

  <circle cx="706"
          cy="404"
          r="4"
          fill="#FFFFFF"
          fill-opacity="0.72"/>

  <circle cx="306"
          cy="405"
          r="3"
          fill="#92ECFF"
          fill-opacity="0.82"/>


  <!-- ==========================================================
       TOP GLASS REFLECTION
  =========================================================== -->

  <path d="M219 257
           C294 185 390 168 470 175"
        stroke="#FFFFFF"
        stroke-opacity="0.11"
        stroke-width="13"
        stroke-linecap="round"/>

  <path d="M772 755
           C747 790 718 815 682 832"
        stroke="#64DFFF"
        stroke-opacity="0.07"
        stroke-width="11"
        stroke-linecap="round"/>

</svg>
